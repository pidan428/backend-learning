server:
  port: 8006
spring:
  application:
    name: 06-redis 缓存模块
  data:
    redis:
      host: localhost
      port: 6379
      database: 10   # 这里配置了 DB10，默认为 DB0
      timeout: 3s
      # Lettuce 默认多条命令复用同一个连接，池化后按连接池取用
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 2
          max-wait: 1s

